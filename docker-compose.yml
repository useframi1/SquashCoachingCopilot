version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: squash_copilot_db
    environment:
      POSTGRES_USER: squash_user
      POSTGRES_PASSWORD: squash_password
      POSTGRES_DB: squash_copilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U squash_user -d squash_copilot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
